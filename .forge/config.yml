# Forge configuration. Every key is documented in docs/CONFIG.md of the Forge plugin.
# Re-run `/forge init` to change answers interactively, or edit this file directly.
schemaVersion: 31
project:
  name: Forge
  description: "Claude Code plugin that runs a software factory: jobs in worktrees, agent roster, PR/tracker sync, dashboard, evals and retros. The repo is also its own plugin marketplace."
  kinds:
    - node
    - cli
    - claude-code-plugin
    - dashboard
  instructions:
    default:
      - AGENTS.md
  notes: "Zero runtime dependencies (Node >= 22.18 built-ins; the engine is TypeScript run by Node's type stripping, no build step). The CLI is the only writer of Forge state. Every job.json/event/config shape change bumps the version in lib/core/job/schema.ts with a migration, and API_VERSION when /api/state changes. Keep README.md, docs/*.md and skills/forge/** in sync with CLI behaviour. Never point the CLI at a real repo's .forge/ while developing: use a scratch repo or FORGE_ROOT. Never add AI attribution anywhere."
git:
  base: develop
  remote: origin
  branchPrefix: forge/
worktrees:
  root: ../{repo}.worktrees
  copy: []
  setup:
    - npm ci
  cleanup: on-merge
  cargo:
    sharedTarget: false
    targetDir: null
  generated:
    - dashboard/dist/**
  generatedBy: dist
commands:
  setup: npm ci
  build: npm run build:dashboard && test -z "$(git status --porcelain -- dashboard/dist)"
  test: set -- {args}; [ $# -gt 0 ] || set -- 'test/**/*.test.ts'; node --test "$@"
  lint: npm run check:touchpoints && for f in $(find lib/trackers dashboard -maxdepth 1 -name '*.mjs') bin/forge; do node --check "$f" || exit 1; done && claude plugin validate . --strict
  format: null
  typecheck: npm run check:dashboard && npm run typecheck
  dev: null
  e2e: if [ -f scripts/render-check.ts ]; then npm run test:render; else echo "no render check on this branch"; fi
  dist: npm run build:dashboard
verify:
  - build
  -
    - lint
    - typecheck
    - test
verifyE2e:
  when: ui
  paths:
    - "*.html"
    - "*.css"
    - "*.scss"
    - "*.sass"
    - "*.less"
    - "*.svelte"
    - "*.vue"
    - "*.jsx"
    - "*.tsx"
    - "*.astro"
    - "dashboard/"
    - "lib/api/"
    - "lib/server/"
    - "test/fixtures/scenarios/"
    - "test/fixtures/render-broken/"
    - "scripts/scenario.ts"
    - "scripts/render-check.ts"
verifyIntegrity: warn
ports:
  base: 4100
  span: 100
runtime:
  provider: anthropic
  host: claude-code
  maxParallelJobs: 4
  diversity: false
  effort: medium
  efforts:
    spec-writer: high
    assistant: high
    retro: high
    judge: high
  effortByComplexity:
    low: low
    medium: medium
    high: high
  modelByComplexity:
    low: sonnet
    medium: null
    high: null
  reworkModel: sonnet
  models:
    orchestrator: inherit
    planner: opus
    assistant: opus
    spec-writer: opus
    designer: sonnet
    builder: opus
    reviewer: sonnet
    approver: opus
    integrator: sonnet
    retro: opus
    judge: opus
    verifier: haiku
tracker:
  kind: github
  local:
    path: .forge/backlog.md
  github:
    repo: null
    ready:
      labels: []
      excludeLabels: []
      assignee: null
      milestone: null
      projectStatus: null
    claim:
      assign: true
    comments: collaborators
    statusSync: labels
    labels:
      prefix: "forge:"
    project:
      config: .github/project-config.yml
      owner: null
      number: null
      statusField: Status
      statusMap: {}
pipeline:
  plan: auto
  specApproval: always
  design: none
  maxRounds: 3
  budget:
    tokens: null
    usd: null
    minutes: null
    changedLines: null
    verifyRetries: 2
review:
  blockOn:
    - blocker
    - major
  panel:
    - name: code
      always: true
      checklist: .forge/reviewers/code.md
    - name: security
      model: opus
      effort: high
      when: lib/server/**, lib/engine/pr/**, lib/engine/trackers/**, lib/integrations/github/**, lib/integrations/backlog/**, lib/trackers/*, hooks/*, anything that ingests tracker/PR/web text, runs shell commands, or touches the dashboard's Host/Origin/token checks
      paths:
        - lib/server/**
        - lib/engine/pr/**
        - lib/engine/trackers/**
        - lib/integrations/github/**
        - lib/integrations/backlog/**
        - lib/trackers/**
        - hooks/**
        - lib/engine/guard/**
        - lib/office/**
        - lib/integrations/claude/**
        - lib/core/job/session-files.ts
        - lib/core/job/requests.ts
        - bin/forge
        - package.json
        - package-lock.json
        - .github/workflows/**
        - lib/engine/pipeline/step.ts
        - lib/engine/pipeline/step/**
        - lib/engine/pipeline/scope.ts
        - lib/engine/pipeline/panel.ts
        - lib/cli/commands/job.ts
        - lib/cli/commands/job/**
        - lib/engine/evals/overlay.ts
        - lib/engine/workspace/**
        - lib/engine/verify/**
        - dashboard/src/lib/markdown.ts
    - name: docs
      model: haiku
      effort: low
      when: the diff adds, removes or renames a CLI command, flag or JSON output field, a config key or an /api shape, or changes orchestrator behaviour in skills/forge/**
      paths:
        - README.md
        - docs/**
        - skills/forge/**
        - lib/cli/commands/**
        - lib/core/job/schema.ts
        - lib/core/config/load.ts
        - lib/core/config/fields.ts
    - name: design
      model: opus
      effort: high
      checklist: .forge/reviewers/design.md
      when: "user-visible dashboard changes: dashboard/src/**, dashboard/style.css, dashboard/index.html, design/** (themes, phone width, flows, copy, keyboard, contrast)"
      paths:
        - dashboard/src/**
        - dashboard/style.css
        - dashboard/index.html
        - design/**
  onPrFeedback: changed
approver:
  alwaysEscalate: []
pr:
  enabled: true
  draft: false
  closeIssue: true
  labels: []
  reviewers: []
  conflicts: fix
  updateStrategy: merge
merge:
  auto: false
  method: squash
  autoWhen:
    - any change the approver approves with every review lens passing
aiAttribution: forbid
resources: []
components:
  - name: library
    path: .
    kind: library
    notes: "The engine behind everything else: the lib layers below cli (api, core, integrations, engine, office, server) and lib/trackers/. Strict TypeScript run by Node's type stripping, zero runtime dependencies. The only writer of Forge state: shapes live in lib/core/types.ts and lib/core/job/schema.ts, versioned with migrations."
  - name: cli
    path: .
    kind: library
    notes: "The forge command: bin/forge, lib/cli/main.ts (routing only) and lib/cli/commands/ (one module per group, each with its HELP table). Used by humans, by the dashboard and by agents, so command names, flags, exit codes and JSON output are a public contract. Keep README's CLI table (npm run docs:commands) and docs/CLI.md in sync."
    dependsOn:
      - component: library
        type: build
  - name: dashboard
    path: .
    kind: app
    notes: "The web UI: dashboard/ (Svelte 5 in src/, style.css, index.html). Built into dashboard/dist/, which forge dash serves; dist/ is gitignored on develop, so never commit or hand-edit it (only release and hotfix commits on main commit it). dashboard/src/lib/types.ts mirrors the /api shapes that lib/server/start.ts serves."
    dependsOn:
      - component: cli
        type: runtime
      - component: library
        type: runtime
  - name: plugin
    path: .
    kind: library
    notes: "The Claude Code plugin: skills/forge/, agents/, reviewers/, templates/, hooks/ and .claude-plugin/ (the plugin manifest and marketplace). Prompts are product: short, imperative, one-line reply contract."
    dependsOn:
      - component: cli
        type: runtime
  - name: docs
    path: .
    kind: library
    notes: README.md and docs/*.md. Keep in sync with CLI behaviour; use the terms in docs/GLOSSARY.md.
    dependsOn:
      - component: cli
        type: runtime
infra:
  mode: agent
  allowed:
    - gh
    - kubectl get
    - kubectl describe
    - kubectl logs
    - aws sts get-caller-identity
    - gcloud config list
    - gcloud auth list
  notes: Only read-only commands are allowed; anything that mutates cloud state is escalated. aws and gcloud read-only subcommands cannot be expressed as safe prefixes, so add specific ones here when a job needs them.
usage:
  track: true
  pricing: {}
improve:
  retroEvery: 10
  maxLearnings: 30
evals:
  testPattern: ^test/.*\.test\.ts$
dashboard:
  port: 7400
daemon:
  enabled: true
  command: claude -p --model sonnet --input-format stream-json --output-format stream-json --verbose --plugin-dir {pluginRoot} {session} --permission-mode default --allowedTools {allowedTools}
  allowedTools:
    - Agent
    - Skill
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - Bash(forge:*)
    - Bash(git status:*)
    - Bash(git rev-parse:*)
    - Bash(git add:*)
    - Bash(git rm:*)
    - Bash(git commit:*)
    - Bash(git merge --abort:*)
    - Bash(git rebase --abort:*)
    - Bash(gh pr view:*)
    - Bash(gh pr list:*)
    - Bash(gh pr checks:*)
    - Bash(gh run view:*)
  maxConcurrent: 6
  idleStopMinutes: 30
foreman:
  enabled: true
  decides:
    - spec-approval
    - split-approval
    - escalation
    - rounds-exhausted
    - conflicts
    - pr-feedback
    - repo-proposal
    - release
  reserved:
    - gate:release
  ship: merge
repos: []
downstream:
  enabled: true
  max: 5
  skip: []
