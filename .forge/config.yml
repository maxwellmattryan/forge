# Forge configuration. Every key is documented in docs/CONFIG.md of the Forge plugin.
# Re-run `/forge init` to change answers interactively, or edit this file directly.
schemaVersion: 1
project:
  name: Forge
  description: "Claude Code plugin that runs a software factory: jobs in worktrees, agent roster, PR/tracker sync, dashboard, evals and retros. The repo is also its own plugin marketplace."
  kinds:
    - node
    - cli
    - claude-code-plugin
    - dashboard
  instructions:
    - AGENTS.md
  notes: "Zero runtime dependencies (Node >= 22.18 built-ins; the engine is TypeScript run by Node's type stripping, no build step, and unconverted files are ESM with JSDoc until the conversion finishes). The CLI is the only writer of Forge state. Every job.json/event/config shape change bumps the version in lib/schema.ts with a migration, and API_VERSION when /api/state changes. Keep README.md, docs/*.md and skills/forge/** in sync with CLI behaviour. Never point the CLI at a real repo's .forge/ while developing: use a scratch repo or FORGE_ROOT. Never add AI attribution anywhere."
git:
  base: main
  remote: origin
  branchPrefix: forge/
worktrees:
  root: ../{repo}.worktrees
  copy: []
  setup:
    - npm ci
  cleanup: on-merge
  cargo:
    sharedTarget: false
    targetDir: null
commands:
  setup: npm ci
  build: 'npm run build:dashboard && test -z "$(git status --porcelain -- dashboard/dist)"'
  test: npm run test
  lint: for f in lib/*.mjs lib/commands/*.mjs lib/trackers/*.mjs dashboard/*.mjs bin/forge; do [ -e "$f" ] || continue; node --check "$f" || exit 1; done && claude plugin validate . --strict
  format: null
  typecheck: npm run check:dashboard && npm run typecheck
  dev: null
  e2e: null
verify:
  - build
  - lint
  - typecheck
  - test
ports:
  base: 4100
  span: 100
runtime:
  provider: anthropic
  host: claude-code
  maxParallelJobs: 2
  models:
    orchestrator: inherit
    planner: opus
    spec-writer: opus
    designer: sonnet
    builder: opus
    reviewer: sonnet
    approver: opus
    integrator: sonnet
    retro: opus
    judge: opus
tracker:
  kind: github
  local:
    path: .forge/backlog.md
  github:
    repo: null
    ready:
      labels: []
      excludeLabels: []
      assignee: null
      milestone: null
      projectStatus: null
    claim:
      assign: true
    comments: collaborators
    statusSync: labels
    labels:
      prefix: "forge:"
    project:
      config: .github/project-config.yml
      owner: null
      number: null
      statusField: Status
      statusMap: {}
pipeline:
  plan: auto
  specApproval: always
  design: none
  maxRounds: 3
review:
  blockOn:
    - blocker
    - major
  panel:
    - name: code
      always: true
    - name: tests
      always: true
    - name: security
      model: opus
      when: lib/server.mjs, lib/pr.mjs, lib/trackers/*, hooks/*, anything that ingests tracker/PR/web text, runs shell commands, or touches the dashboard's Host/Origin/token checks
    - name: docs
      when: CLI commands or their JSON output, config keys, orchestrator behaviour in skills/forge/**, or anything README.md and docs/*.md describe
  onPrFeedback: changed
approver:
  alwaysEscalate:
    - changes to CI/CD, deploy, release or infrastructure config
    - database or data migrations
    - new or upgraded dependencies (the repo has zero runtime dependencies by rule)
    - public API or protocol breaking changes
    - anything touching credentials, auth or permissions
    - shape changes to job.json, events or config without a schema version bump and migration in lib/schema.ts
    - changes to the dashboard security posture in lib/server.mjs (loopback Host check, token, Origin, JSON-only POSTs)
    - version bumps in package.json or .claude-plugin/plugin.json
pr:
  enabled: true
  draft: false
  closeIssue: true
  labels: []
  reviewers: []
  conflicts: fix
  updateStrategy: merge
merge:
  auto: false
  method: squash
  autoWhen: []
aiAttribution: forbid
resources: []
services: []
infra:
  mode: agent
  allowed:
    - gh
    - kubectl get
    - kubectl describe
    - kubectl logs
    - aws sts get-caller-identity
    - gcloud config list
    - gcloud auth list
  notes: Only read-only commands are allowed; anything that mutates cloud state is escalated. aws and gcloud read-only subcommands cannot be expressed as safe prefixes, so add specific ones here when a job needs them.
usage:
  track: true
  pricing: {}
improve:
  retroEvery: 10
  maxLearnings: 30
evals:
  testPattern: ^test/.*\.test\.(mjs|ts)$
dashboard:
  port: 7400
  launcher: null
