title: "Tests fail under a daemon session: FORGE_DAEMON leaks into bin/forge subprocesses"
request: |
  Tests fail under a daemon session: FORGE_DAEMON leaks into bin/forge subprocesses

  ## Why

  When a daemon session (`daemon.enabled`, a headless `claude -p` that `forge dash` supervises) drives a job, every configured command it runs on the job's behalf inherits the session's daemon markers: `FORGE_DAEMON`, `FORGE_DAEMON_TRUST` and `FORGE_DAEMON_SCOPE`. That covers `forge verify` steps, `forge run <job> <name>`, `forge run --background` and the `worktrees.setup` commands. Any such command that calls `forge` itself, for example this repo's own test suite driving scratch repos through `bin/forge`, then trips the daemon trust guard in `lib/config.ts` ("changed since a human started the daemon") and fails, while the same command passes when a human runs it. About 50 tests fail this way under a daemon-driven job (found while building the retro job).

  ## What to build

  Configured commands must run without the daemon markers, so they behave the same whoever drives the job. Do it in the one place that builds the environment for job commands (`lib/worktree.ts`), not in the test suite (the suite already strips them for its own children). Keep everything else that env sets today: `FORGE_JOB`, `FORGE_WORKTREE`, `PORT`/`FORGE_PORT`, the git pins (`core.hooksPath`, `core.fsmonitor`), `GIT_EDITOR` and `PATH`. Never mutate `process.env`. The session's own `forge` calls stay checked; only the children it runs as configured commands are exempt. Document the behaviour and why it is safe in one sentence each in `docs/CONFIG.md` (daemon section) and `docs/ARCHITECTURE.md` ("Trust boundary").

  ## Interface

  Export `envFor(job, worktree, port, base = process.env)` from `lib/worktree.ts`: it returns a copy of `base` with every key equal to `FORGE_DAEMON` or starting with `FORGE_DAEMON_` removed (a key like `FORGE_DAEMONISH` stays), then the job variables set as today (`PORT` is `''` when `port` is null). Tests call it with an explicit `base`.

  ## Acceptance criteria

  - `envFor` strips the markers as described, keeps unrelated keys and the git pins, and leaves `process.env` untouched.
  - With `FORGE_DAEMON=1`, `FORGE_DAEMON_TRUST=<the repo's trust digest>` and `FORGE_DAEMON_SCOPE=<job>` in the environment, `forge verify <job>`, `forge run <job> test` and `forge run <job> dev --background` succeed in a scratch repo whose `commands.*` call `bin/forge status` against a second scratch repo.
  - The daemon's own guard still refuses the outer session's `forge` call after `.forge/config.yml` changes.
  - New tests in `test/command-env.test.ts` cover the above using `tempRepo` from `test/helpers.ts`.
  - `npm run typecheck` and `node --test "test/*.test.ts"` pass.
