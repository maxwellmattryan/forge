title: CLI rejects malformed --field JSON, unknown job ids and bare flags instead of corrupting state
request: |
  CLI rejects malformed --field JSON, unknown job ids and bare flags instead of corrupting state


  ## Why

  The CLI is the only writer of Forge state, yet several `forge job` paths accept input that silently corrupts a job or creates ghost state, and the orchestrator (a daemon session following the skill) is the one typing these commands. Each of these is a real failure observed by probing the CLI in a scratch repo:

  1. `forge job set J --field 'reviewers=[code,tests]'` (shell-unquoted JSON, the most likely way to type it) exits 0 and stores the string `"[code,tests]"`, because `coerce` in `lib/util.ts` falls back to the raw string when `JSON.parse` fails. The next `forge job step J` then dies with `(job.reviewers ?? []).map is not a function` and `forge job verdicts` treats each character as a lens.
  2. `forge job note nope hi` and `forge job human nope approve` print `{"ok":true}` and create `.forge/jobs/nope/events.jsonl` without a `job.json` (`lib/commands/job.ts` `note` and `human` cases never call `loadJob`). `forge retro prepare nope` likewise writes `stats.json`, `signals.md` and `runtime.json` into a ghost dir. `forge job decision nope` and `forge job progress nope` return empty results instead of "no job".
  3. `forge requests add resume --job` (bare flag, no value) enqueues a request with `"job": true`.
  4. `forge job agent J end --summary` (bare flag) fails with the raw `rec.summary.slice is not a function`; `forge job agent J end --tokens abc` stores NaN-derived nulls in `usage`.
  5. `forge job human J <typo>` accepts any action string, so a typo skews `forge stats`, which reads `approve-spec` / `revise-spec` / `rework` from the events.

  ## What to build

  In `lib/commands/args.ts` add small validators next to `req`: a `requireJob(root, id)` style guard (loads the job and throws the existing "no job" `ForgeError`), a number validator (`--tokens`, `--limit`, `--tail` must be finite non-negative numbers), and an enum validator for `forge job human` actions (the set listed in its usage string; drop `reject` if nothing reads it). In `lib/util.ts` `coerce`, a value that starts with `[` or `{` but does not parse as JSON must throw a `ForgeError` naming the field and showing the correctly quoted form (the hint that already exists at the `--field` repair message in `job.ts`), never fall back to a string. For known array fields on `forge job set --field` (`reviewers`, `services`, `dependsOn`, `children`) reject a non-array value. A bare flag where a string value is required (`--job`, `--summary`, `--note`, `--session`) must fail with "missing value for --job", not store `true`.

  Apply the guards to: `job note`, `job human`, `job decision`, `job progress`, `job agent`, `job set`, `job release`, `job claim`, `retro prepare`, `requests add --job`, `tracker list --limit`, `next --limit`, `run --tail`.

  Keep `lib/cli.ts` routing-only. No schema or API_VERSION change. No new dependency. Error messages stay one line, `forge: <message>`, exit code 2 as today for usage errors.

  ## Acceptance criteria

  - `forge job set J --field 'reviewers=[code,tests]'` exits non-zero with a one-line message that shows the quoted form; `job.json` is unchanged.
  - `forge job set J --field 'reviewers="code"'` (a string for an array field) is rejected the same way.
  - `forge job note nope hi`, `forge job human nope approve`, `forge job decision nope`, `forge job progress nope` and `forge retro prepare nope` each exit non-zero with `no job nope` (or the existing wording) and leave no `.forge/jobs/nope` directory behind.
  - `forge requests add resume --job` (no value) exits non-zero with a message naming `--job`; no request file is written.
  - `forge job agent J end --summary` and `--tokens abc` exit non-zero with one-line messages; `job.json` usage is unchanged.
  - `forge job human J bogus` exits non-zero listing the valid actions; valid actions still work and `forge stats` still counts them.
  - A new `test/args.test.ts` covers `parseArgs` bare-flag handling and each validator, and `test/cli.test.ts` (or `jobs.test.ts`) covers the ghost-dir and `--field` cases above, using `FORGE_ROOT` scratch repos as `test/helpers.ts` does.
  - `npm run typecheck`, `node --test "test/*.test.ts"` and `claude plugin validate . --strict` pass.
  - README.md / skills/forge/** need no change unless a command's accepted values changed (the `human` action set); if so, update `skills/forge/reference/commands.md` to match.

  ## Interface

  Name the validators in `lib/commands/args.ts` `str(value, flag)`, `num(value, flag, {integer})`, `oneOf(value, flag, allowed)` and `requireJob(root, id)`, exported, and keep `coerce(value, key)` exported from `lib/util.ts` (it now throws `ForgeError` on malformed JSON). Tests import them by these names.
