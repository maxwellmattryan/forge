title: "Dashboard token counts: B and T units"
request: |
  Dashboard token counts: B and T units

  ## Why

  Large token totals on the dashboard read as `1469.0M`, which is hard to scan. The one formatter behind every token count (`tokensShort` in `dashboard/src/lib/util.ts`: the Analytics TOKENS KPI and per-job average, the Analytics row bars, Evals, job cards and the job drawer) stops at M.

  ## What to build

  Extend the formatter to k → M → B → T. B and T show three decimals (`1.469B`, `2.500T`). When rounding would carry a value to 1000 of a unit, step up to the next unit instead: 999,999 reads `1.0M` (today `1000k`) and 999.96M reads `1.000B` (not `1000.0M`). T is the last unit, so very large values read e.g. `1234.000T`. Everything below M formats exactly as today (`999`, `2k`, `1.2M`, `—` for null). Update the existing golden in `test/dashboard-lib.test.ts` and add cases for B, T and the rounding carry. Rebuild `dashboard/dist/` in the same commit (`npm run build:dashboard`, then a second build must leave it unchanged).

  ## Acceptance criteria

  - `tokensShort(999999) === '1.0M'`, `tokensShort(999_960_000) === '1.000B'`, `tokensShort(1_469_000_000) === '1.469B'`, `tokensShort(2_500_000_000_000) === '2.500T'`, `tokensShort(1_234_000_000_000_000) === '1234.000T'`; `tokensShort(null) === '—'`, `tokensShort(999) === '999'`, `tokensShort(1500) === '2k'`, `tokensShort(1234567) === '1.2M'`.
  - `npm run check:dashboard`, `npm run typecheck`, `npm run build:dashboard` leaving `dashboard/dist` clean, and `node --test "test/*.test.ts"` pass.
