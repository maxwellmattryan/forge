# Forge's own gate: the "Verify before claiming it works" list in AGENTS.md, in the same order.
# test/ci-workflow.test.ts fails when the two drift, so edit both together. It runs on Linux only.
# release.yml calls this whole workflow (workflow_call) before it tags a release, and `npm run release`
# waits for its push run on the release commit before it pushes main (docs/RELEASES.md, docs/CI.md).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.x']
        # The suite is CPU-bound and a hosted runner has 3-4 cores, so each cell runs half the test files.
        shard: ['1/2', '2/2']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Typecheck engine and tests
        run: npm run typecheck
      - name: Check dashboard sources
        run: npm run check:dashboard
      - name: Build dashboard
        run: npm run build:dashboard
      - name: Run tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
          # The tests of the real build run here (it was just built) instead of skipping (test/dist.ts).
          FORGE_REQUIRE_DIST: '1'
        run: node --test --test-shard="$TEST_SHARD" "test/**/*.test.ts"
      - name: Syntax-check JavaScript entry points
        run: for f in bin/forge lib/trackers/status.mjs dashboard/*.mjs; do node --check "$f"; done
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.299
      - name: Validate plugin
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: claude plugin validate . --strict

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Audit devDependencies (report only)
        continue-on-error: true
        run: npm audit

  release-check:
    name: release check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release metadata
        env:
          # The PR's base, or the pushed or dispatched branch: develop never tracks dashboard/dist, main must.
          REF: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$REF" in
            develop) npm run release:check -- --dist absent ;;
            main) npm run release:check -- --dist present ;;
            *) npm run release:check ;;
          esac

