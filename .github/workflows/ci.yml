# Forge's own gate: the "Verify before claiming it works" list in AGENTS.md, in the same order.
# test/ci-workflow.test.ts fails when the two drift, so edit both together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '24.x']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Typecheck engine and tests
        run: npm run typecheck
      - name: Check dashboard sources
        run: npm run check:dashboard
      - name: Build dashboard
        run: npm run build:dashboard
      - name: Check dashboard/dist is committed
        run: |
          stale="$(git status --porcelain -- dashboard/dist)"
          if [ -n "$stale" ]; then
            echo "::error title=Stale dashboard/dist::dashboard/dist is stale: run npm run build:dashboard and commit dashboard/dist"
            echo "Stale files:"
            echo "$stale"
            exit 1
          fi
      - name: Run tests
        run: node --test "test/*.test.ts"
      - name: Syntax-check JavaScript entry points
        run: for f in bin/forge lib/trackers/status.mjs dashboard/*.mjs; do node --check "$f"; done
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.299
      - name: Validate plugin
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: claude plugin validate . --strict

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Audit devDependencies (report only)
        continue-on-error: true
        run: npm audit
