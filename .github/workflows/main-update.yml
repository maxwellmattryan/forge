# Forge's main-update build: a push to a release/v* branch (the release commit `npm run release` pushes),
# or a manual run on one when its artifact has expired, builds the dashboard with a read-only token and
# uploads dashboard/dist/ as the dashboard-dist artifact. Nothing here writes: `npm run release`
# (scripts/release.ts) waits for this run on the release commit, checks the artifact and pushes the main
# update (the release commit plus it, on top of main) to the release branch itself.
# test/invariants/main-update-workflow.test.ts pins this file; docs/RELEASES.md explains the flow.
name: Main update

on:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-update-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    # workflow_dispatch can name any branch: only a release branch builds.
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build:dashboard
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 7
