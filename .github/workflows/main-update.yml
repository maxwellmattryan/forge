# Forge's main-update: every push to develop (or a manual run on develop) runs all of ci.yml, builds the
# dashboard in a job with a read-only token, and then, in a job that runs no npm, checks that build and
# force-pushes one commit to ci/main-update: develop's tree plus dashboard/dist/, with parents
# [main, develop]. It opens the one PR from ci/main-update into main, or updates it, and dispatches
# ci.yml on that branch, because a push made with this token starts no PR checks of its own.
# test/main-update-workflow.test.ts pins this file; docs/RELEASES.md explains the flow.
name: Main update

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml

  build:
    name: build
    needs: verify
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build:dashboard
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's tip, the tags and develop's history decide the commit, its title and the hotfix list.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: ${{ runner.temp }}/dist
      - name: Build the main-update commit and PR body
        env:
          DEVELOP: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          main="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          node scripts/main-update.ts commit --main "$main" --develop "$DEVELOP" --dist "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/sha"
          node scripts/main-update.ts body --main "$main" --develop "$DEVELOP" --run-url "$RUN_URL" --dist "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/body.md"
      - name: Push ci/main-update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(cat "$RUNNER_TEMP/sha")"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=No main-update commit::scripts/main-update.ts printed no commit sha"
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin "$sha:refs/heads/ci/main-update"
      - name: Open or update the main-update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 "$RUNNER_TEMP/body.md")"
          title="${title#title=}"
          tail -n +2 "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/pr-body.md"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head ci/main-update --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head ci/main-update --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          elif [[ "$pr" =~ ^[0-9]+$ ]]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            echo "::error title=Unexpected PR number::gh pr list printed a non-number"
            exit 1
          fi
      - name: Run CI on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref ci/main-update
