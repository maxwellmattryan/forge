# Forge's main-update build: every push to develop (or a manual run on develop) builds the dashboard with
# a read-only token and uploads dashboard/dist/ as the dashboard-dist artifact. Nothing here writes:
# `npm run release` (scripts/release.ts) waits for this run and ci.yml's on the release commit, checks the
# artifact and pushes develop's tree plus it to main itself. test/main-update-workflow.test.ts pins this
# file; docs/RELEASES.md explains the flow.
name: Main update

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-update-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build:dashboard
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 7
