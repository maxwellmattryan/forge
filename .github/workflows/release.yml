# Forge's release: a push to develop that changes the package.json version and has no v<version> tag yet,
# which is a human merging a release PR into develop with any merge method (docs/RELEASES.md "Releasing").
# detect, verify and build hold a read-only token: verify runs all of ci.yml, and build refuses a push that is more
# than the version bump, builds the dashboard, checks the stable tree (the pushed commit's tree minus
# .github/workflows/ plus dashboard/dist/, scripts/stable-tree.ts) and outputs its sha, writes the Release notes
# (the pushed commit's CHANGELOG section) and a source archive stamped with its commit, and uploads release-files
# and stable-dist. Only the release job
# holds a write token, and it runs nothing but gh, jq, base64, find and shell builtins: it downloads this run's
# files, checks that the pushed commit is the merge commit of this repository's release/v<version> PR into
# develop and that the PR holds one commit, rebuilds the stable tree through the API and refuses unless it is
# build's, commits it onto stable
# with parents [stable, pushed commit], moves stable forward only (force: false, after a re-read), tags that
# commit and publishes the GitHub Release. Any other push stops after detect, and a bumped push with no release
# PR publishes nothing.
# test/invariants/release-workflow.test.ts pins this file.
name: Release

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit and the tags decide whether this push is a release.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decide whether this push is a release
        id: plan
        run: node scripts/release-plan.ts detect >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: build
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tree: ${{ steps.stable.outputs.tree }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags: the stable tree's release check refuses a version already tagged at another commit.
          fetch-depth: 0
      # A commit pushed to the release PR's branch after `npm run release` checked it would ride in with the merge.
      # Refuse anything but the bump before setup-node reads .nvmrc and npm ci installs from a lockfile the push may
      # have edited: against the first parent, only the version files and CHANGELOG.md may differ, the version files
      # only in lines that read the old or the new version, and CHANGELOG.md only by lines added. Plain git, jq, sed
      # and cmp: no repo script, and nothing from the push picks the tools that run. The first parent is develop's
      # previous head for a merge commit, a squash and a rebase of one commit; the release job refuses a release PR of
      # more than one commit, so a rebase merge of several (whose first parent is another commit of the PR) publishes
      # nothing.
      - name: Check the push is only the version bump
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if ! parent="$(git rev-parse --verify -q "$GITHUB_SHA^1")"; then
            echo "::error title=No first parent::the pushed commit has no parent to compare with"
            exit 1
          fi
          old="$(git show "$parent:package.json" | jq -r .version)"
          if ! [[ "$old" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad parent version::the first parent's package.json version is not X.Y.Z"
            exit 1
          fi
          while IFS= read -r -d '' f; do
            case "$f" in
              package.json|package-lock.json|.claude-plugin/plugin.json|CHANGELOG.md) ;;
              *)
                printf '::error title=More than the version bump::the release PR also changes %q\n' "$f"
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z --no-renames "$parent" "$GITHUB_SHA" --)
          # Both versions read as one placeholder, so only the lines that name them may differ.
          re="(${old//./[.]}|${VERSION//./[.]})"
          norm() { git show "$1:$2" | sed -E "s/^([[:space:]]*\"version\": \")$re(\",?)\$/\1V\3/"; }
          for f in package.json package-lock.json .claude-plugin/plugin.json; do
            if ! cmp -s <(norm "$parent" "$f") <(norm "$GITHUB_SHA" "$f"); then
              echo "::error title=More than the version bump::$f changes beyond the lines that name the version"
              exit 1
            fi
          done
          removed="$(git diff --numstat --no-renames "$parent" "$GITHUB_SHA" -- CHANGELOG.md | cut -f2)"
          if [ -n "$removed" ] && [ "$removed" != 0 ]; then
            echo "::error title=More than the version bump::CHANGELOG.md loses lines: a release only adds its section"
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build:dashboard
      # The tree the release job must rebuild through the API, printed only once its checkout passes the release check.
      - name: Check the stable tree
        id: stable
        run: node scripts/stable-tree.ts --develop "$GITHUB_SHA" --dist dashboard/dist >> "$GITHUB_OUTPUT"
      # The notes are frozen in the release commit and reviewed in the PR diff; the PR body is never read.
      - name: Write release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node scripts/release-plan.ts notes > "$RUNNER_TEMP/release/notes.md"
      - name: Build the source archive
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/forge-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="forge-$VERSION/" -o "$archive" "$GITHUB_SHA"
          stamped="$(tar -xzOf "$archive" "forge-$VERSION/COMMIT")"
          if [ "$stamped" != "$GITHUB_SHA" ]; then
            echo "::error title=Unstamped archive::COMMIT in the archive is not $GITHUB_SHA"
            exit 1
          fi
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7
      - name: Upload the stable dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 7

  # No checkout, no action and no node or git: the write token sits beside gh, jq, base64, find and the shell.
  # Every step checks each value it reads by pattern, jq builds every JSON body, and values pass between steps
  # only through files in $RUNNER_TEMP/release.
  release:
    name: release
    needs: [detect, verify, build]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      # Byte ranges in the pattern checks: in another locale [a-f] can match A-F or other letters.
      LC_ALL: C
    steps:
      - name: Check the inputs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad version::the detected version is not X.Y.Z"
            exit 1
          fi
          if ! [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Bad tree::the build's stable tree is not a 40-hex sha"
            exit 1
          fi
          if ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Bad commit::the pushed commit is not a 40-hex sha"
            exit 1
          fi
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-files --dir "$RUNNER_TEMP/release"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name stable-dist --dir "$RUNNER_TEMP/dist"
          test -s "$RUNNER_TEMP/release/notes.md"
          test -s "$RUNNER_TEMP/release/forge-$VERSION.tar.gz"
          # Only the notes and the archive: later steps hand values on through files in this directory.
          while IFS= read -r -d '' f; do
            case "${f#"$RUNNER_TEMP/release/"}" in
              notes.md|"forge-$VERSION.tar.gz") ;;
              *)
                echo "::error title=Unexpected release file::release-files holds more than the notes and the archive"
                exit 1
                ;;
            esac
          done < <(find "$RUNNER_TEMP/release" -mindepth 1 -print0)
          odd="$(find "$RUNNER_TEMP/dist" -mindepth 1 ! -type f ! -type d)"
          if [ -n "$odd" ]; then
            echo "::error title=Odd dist file::stable-dist holds something other than plain files and directories"
            exit 1
          fi
          allowed='^(index\.html|manifest\.json|build-stamp\.json|assets/[A-Za-z0-9_.-]+\.(js|css|woff2))$'
          while IFS= read -r -d '' f; do
            if ! [[ "${f#"$RUNNER_TEMP/dist/"}" =~ $allowed ]]; then
              echo "::error title=Unexpected dist file::stable-dist holds a file outside index.html, manifest.json, build-stamp.json and assets/*.js|css|woff2"
              exit 1
            fi
          done < <(find "$RUNNER_TEMP/dist" -mindepth 1 -type f -print0)
      # The filter reads only env inside a single-quoted program, so no API value reaches the shell but the
      # number, which must be digits, and the commit count, which must be 1. build compared the pushed commit
      # with its first parent, which is develop's previous head for a merge commit, a squash and a rebase of one
      # commit but another commit of the PR for a rebase of several. npm run release makes a PR of one commit, and
      # for that PR the comparison covers every merge method.
      - name: Find the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "develop" and .head.ref == ("release/v" + env.VERSION) and .head.repo.full_name == env.GITHUB_REPOSITORY and .merge_commit_sha == env.GITHUB_SHA)] | if length == 1 then .[0].number else empty end')"
          case "$pr" in
            ''|*[!0-9]*)
              echo "::error title=No release PR::$GITHUB_SHA is not the merge commit of exactly one release/v$VERSION PR from this repository into develop"
              exit 1
              ;;
          esac
          commits="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .commits)" || commits=
          if [ "$commits" != 1 ]; then
            echo "::error title=More than one commit::the release PR must hold exactly the release commit that npm run release made"
            exit 1
          fi
          printf '\nRelease PR: %s/%s/pull/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$pr" >> "$RUNNER_TEMP/release/notes.md"
      - name: Check the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          # matching-refs matches by prefix, so only the exact name counts.
          found="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '[.[] | select(.ref == ("refs/tags/v" + env.VERSION))] | length')"
          if [ "$found" != 0 ]; then
            echo "::error title=Tag exists::v$VERSION already exists: publish by hand (docs/RELEASES.md \"Recovery\")"
            exit 1
          fi
      - name: Read stable
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          start="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --jq .object.sha)" || start=
          if ! [[ "$start" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=No stable branch::create it from v0.22.0 (docs/RELEASES.md)"
            exit 1
          fi
          printf '%s\n' "$start" > "$RUNNER_TEMP/release/stable-start"
      # The tree release.yml's build checked, made again from the pushed commit's tree and this run's stable-dist:
      # an artifact swapped after build uploaded it gives another tree.
      - name: Build the stable tree
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          base="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=No base tree::the pushed commit's tree is not a 40-hex sha"
            exit 1
          fi
          entries="$RUNNER_TEMP/stable-entries.jsonl"
          : > "$entries"
          # Every workflow file is dropped: GITHUB_TOKEN can't move a ref across a change to one.
          workflows="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$base?recursive=1" --jq 'if .truncated then error("the tree listing is truncated") else .tree[] | select(.type == "blob" and (.path | startswith(".github/workflows/"))) | .path end')"
          workflow_re='^\.github/workflows/[A-Za-z0-9._/-]+$'
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if ! [[ "$p" =~ $workflow_re ]]; then
              echo "::error title=Odd workflow path::a path under .github/workflows/ has characters outside [A-Za-z0-9._/-]"
              exit 1
            fi
            jq -cn --arg path "$p" '{path: $path, mode: "100644", type: "blob", sha: null}' >> "$entries"
          done <<< "$workflows"
          dist="$RUNNER_TEMP/dist"
          if [ -n "$(find "$dist" -mindepth 1 ! -type f ! -type d)" ]; then
            echo "::error title=Odd dist file::stable-dist holds something other than plain files and directories"
            exit 1
          fi
          allowed='^(index\.html|manifest\.json|build-stamp\.json|assets/[A-Za-z0-9_.-]+\.(js|css|woff2))$'
          files=()
          while IFS= read -r -d '' f; do
            rel="${f#"$dist/"}"
            if ! [[ "$rel" =~ $allowed ]]; then
              echo "::error title=Unexpected dist file::stable-dist holds a file outside index.html, manifest.json, build-stamp.json and assets/*.js|css|woff2"
              exit 1
            fi
            files+=("$rel")
          done < <(find "$dist" -mindepth 1 -type f -print0)
          for rel in "${files[@]}"; do
            base64 -w0 "$dist/$rel" > "$RUNNER_TEMP/blob.b64"
            blob="$(jq -n --rawfile content "$RUNNER_TEMP/blob.b64" '{content: $content, encoding: "base64"}' | gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
            if ! [[ "$blob" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=No blob::a dist file's blob was not created"
              exit 1
            fi
            jq -cn --arg path "dashboard/dist/$rel" --arg sha "$blob" '{path: $path, mode: "100644", type: "blob", sha: $sha}' >> "$entries"
          done
          tree="$(jq -s --arg base "$base" '{base_tree: $base, tree: .}' "$entries" | gh api -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
          if [ "$tree" != "$TREE" ]; then
            echo "::error title=Tree mismatch::the stable tree made through the API is not the one build checked"
            exit 1
          fi
      # A re-run after a failed tag step finds its own commit at stable's tip and reuses it.
      - name: Commit onto stable
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          read -r start < "$RUNNER_TEMP/release/stable-start"
          [[ "$start" =~ ^[0-9a-f]{40}$ ]] || exit 1
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$start" --jq '[.tree.sha, (.parents[1].sha // "none")] | join(" ")')"
          read -r tip_tree tip_second <<< "$tip"
          if [ "$tip_second" = "$GITHUB_SHA" ] && [ "$tip_tree" = "$TREE" ]; then
            commit="$start"
            echo "stable is already at the release commit $commit: reusing it"
          else
            commit="$(jq -n --arg start "$start" '{message: ("Release " + env.VERSION), tree: env.TREE, parents: [$start, env.GITHUB_SHA]}' | gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=No commit::the stable commit was not created"
              exit 1
            fi
            now="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --jq .object.sha)" || now=
            if [ "$now" != "$start" ]; then
              echo "::error title=stable moved::stable is no longer at $start: re-run the workflow"
              exit 1
            fi
            # force=false: a fast-forward only, so stable never moves backwards or sideways.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$commit" -F force=false > /dev/null
          fi
          printf '%s\n' "$commit" > "$RUNNER_TEMP/release/stable-commit"
      - name: Create the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          read -r commit < "$RUNNER_TEMP/release/stable-commit"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" -f message="Forge $VERSION" -f object="$commit" -f type=commit --jq .sha)"
          if ! [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=No tag object::the tag object for v$VERSION was not created"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_sha" > /dev/null
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TREE: ${{ needs.build.outputs.tree }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          read -r commit < "$RUNNER_TEMP/release/stable-commit"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$commit" --title "Forge $VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" "$RUNNER_TEMP/release/forge-$VERSION.tar.gz"
