# Forge's release: on a push to main that changes the package.json version and has no v<version> tag
# yet, run all of ci.yml, build a source archive stamped with its commit, tag the pushed commit and
# publish a GitHub Release whose body is that version's CHANGELOG section. Any other push stops after
# detect. test/invariants/release-workflow.test.ts pins this file; docs/RELEASES.md explains the flow.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit and the tags decide whether this push is a release.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decide whether this push is a release
        id: plan
        run: node scripts/release-plan.ts detect >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: [detect, verify]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Write release notes
        run: node scripts/release-plan.ts notes > "$RUNNER_TEMP/notes.md"
      - name: Build the source archive
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/forge-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="forge-$VERSION/" -o "$archive" "$GITHUB_SHA"
          stamped="$(tar -xzOf "$archive" "forge-$VERSION/COMMIT")"
          if [ "$stamped" != "$GITHUB_SHA" ]; then
            echo "::error title=Unstamped archive::COMMIT in the archive is not $GITHUB_SHA"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          sha256sum "forge-$VERSION.tar.gz" > "forge-$VERSION.tar.gz.sha256"
      - name: Create the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" -f message="Forge $VERSION" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_sha" > /dev/null
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Forge $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/forge-$VERSION.tar.gz" "$RUNNER_TEMP/forge-$VERSION.tar.gz.sha256"
