<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<div class="row wrap" style="gap:10px">
  <button class="btn primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/><path class="cx" d="M7 12h13"/></svg>Run next</button><button class="btn">Stop</button><button class="btn sm">Load older</button><button class="btn" disabled title="No sessions to stop">Stop</button><button class="btn icon" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/><circle class="cx" cx="12" cy="12" r="9"/></svg></button><button class="btn sm sel" aria-pressed="true">Follow</button>
</div>
<div class="row wrap" style="gap:14px;margin-top:14px">
  <div class="seg"><button class="btn sm sel">Active <span class="num" style="opacity:.7">3</span></button><button class="btn sm hover">Waiting <span class="muted num">1</span></button><button class="btn sm">Done <span class="muted num">12</span></button><button class="btn sm">All <span class="muted num">16</span></button></div>
  <div class="seg"><button class="btn sm sel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7v16H3zM14 4h7v10h-7z"/></svg>Board</button><button class="btn sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 10h18M3 15h18M9 5v14"/></svg>Table</button></div>
</div>
</div></body>
</html>
