<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
  <div class="sheet ticks col" style="padding:16px;gap:8px"><span class="tk"></span><h3 class="h section">Dependencies</h3><div class="muted caption">Solid outline with ticks: a thing.</div></div>
  <div class="sheet dashed col" style="padding:16px;gap:8px"><div class="label">Review</div><div class="muted caption">Dashed, no ticks: a container of things.</div></div>
  <div class="sheet ticks redline col" style="padding:16px;gap:8px"><span class="tk"></span><div class="row" style="justify-content:space-between"><h3 class="h section">Needs you</h3><span class="chip rev">REV</span></div><div class="muted caption">Redline: a thing waiting on a person.</div></div>
  <button class="sheet ticks clickable col" style="padding:16px;gap:8px;text-align:left;font:inherit;color:inherit"><span class="tk"></span><h3 class="h section">Clickable</h3><span class="muted caption">A clickable sheet at rest: opaque panel.</span></button>
  <button class="sheet ticks clickable hover col" style="padding:16px;gap:8px;text-align:left;font:inherit;color:inherit"><span class="tk"></span><h3 class="h section">Hovered</h3><span class="muted caption">Hovered: the line strengthens and the sketch draws in.</span></button>
</div>
</div></body>
</html>
