<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<!-- Unscoped: completing a job verb. -->
<div class="sheet ticks solid col" style="max-width:672px;box-shadow:var(--shadow-dialog)"><span class="tk"></span><div class="row" style="gap:10px;border-bottom:1px solid var(--line);padding:0 12px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--muted)"><path d="M12 5v14M5 12h14"/><circle class="cx" cx="12" cy="12" r="8"/></svg><input class="input" value="approve job-c" aria-label="Command" style="border:0;flex:1;font-size:15px;padding:12px 0"></div><ul role="listbox" style="list-style:none;margin:0;padding:6px"><li role="option" aria-selected="true" class="row" style="gap:12px;padding:8px 12px;background:var(--raised);box-shadow:inset 3px 0 0 var(--ink)"><span class="mono" style="color:var(--fg)">job-c90e</span><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Add a tracker adapter for Linear</span><span class="chip rev">REV · spec gate</span></li><li role="option" class="row muted" style="gap:12px;padding:8px 12px"><span class="mono" style="color:var(--fg)">job-c1d7</span><span class="grow">Clamp the KPI grid on phones</span><span class="chip muted">queued</span></li><li role="option" class="row muted" style="gap:12px;padding:8px 12px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--ink)"><path d="M12 5v14M5 12h14"/><circle class="cx" cx="12" cy="12" r="8"/></svg><span style="color:var(--fg);font-weight:500">Send</span><span class="mono">approve job-c</span></li></ul><div class="row" style="justify-content:flex-end;border-top:1px solid var(--line);padding:10px 16px"><button class="btn primary">Send</button></div></div>
<!-- Scoped from a job's drawer, over the scrim: the chip, its remove button, the job's verbs first, then the global verbs. -->
<div class="scrim" style="margin-top:24px;padding:24px">
<div class="sheet ticks solid col" style="max-width:672px;box-shadow:var(--shadow-dialog)"><span class="tk"></span><div class="row" style="gap:8px;border-bottom:1px solid var(--line);padding:0 12px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--muted)"><path d="M12 5v14M5 12h14"/><circle class="cx" cx="12" cy="12" r="8"/></svg><span class="chip ink sm" title="job-c90e" style="max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">For job-c90e</span><button class="btn icon sm ghost" aria-label="Remove the job scope"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><input class="input" value="" placeholder="Describe a new job, or type a command" aria-label="Command" style="border:0;flex:1;font-size:15px;padding:12px 0"></div><ul role="listbox" style="list-style:none;margin:0;padding:6px"><li role="option" aria-selected="true" class="row" style="gap:12px;padding:8px 12px;background:var(--raised);box-shadow:inset 3px 0 0 var(--ink)"><span class="mono" style="color:var(--fg);width:64px">approve</span><span class="mono">job-c90e</span></li><li role="option" class="row muted" style="gap:12px;padding:8px 12px"><span class="mono" style="color:var(--fg);width:64px">revise</span><span class="mono">job-c90e</span></li><li role="option" class="row muted" style="gap:12px;padding:8px 12px"><span class="mono" style="color:var(--fg);width:64px">cancel</span><span class="mono">job-c90e</span></li><li role="option" class="row muted" style="gap:12px;padding:8px 12px"><span class="mono" style="color:var(--fg);width:64px">next</span><span>Take the next ready backlog items: next [n]</span></li></ul><div class="row" style="justify-content:flex-end;border-top:1px solid var(--line);padding:10px 16px"><button class="btn primary" disabled>Run</button></div></div>
</div>
<!-- The phone FAB: 56px, square, primary, fixed at the bottom right above the safe area. -->
<div class="row" style="justify-content:flex-end;margin-top:24px;max-width:390px"><button class="btn primary icon" aria-label="New job or command" style="width:56px;height:56px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/><circle class="cx" cx="12" cy="12" r="8"/></svg></button></div>
</div></body>
</html>
