<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .cover svg { position: absolute; inset: 0; }
  .grid { stroke: var(--grid-major); stroke-width: 1; }
  .ink { fill: var(--ink); }
  .ground-cut { fill: var(--bg); }
  .red { fill: var(--redline); }
  .hl { fill: var(--highlight); }
  .ln { stroke: var(--line-strong); stroke-width: 1; fill: none; }
  .soft { stroke: var(--line-soft); stroke-width: 1; }
  .name { position: absolute; left: 48px; bottom: 62px; margin: 0; font-family: var(--font-head); font-size: 120px; line-height: .9; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); max-width: 440px; }
  .tagline { position: absolute; left: 52px; bottom: 36px; margin: 0; font-family: var(--font-mono); font-size: 13px; line-height: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); max-width: 440px; }
</style>
</head>
<body>
<div class="cover">
<!--
  blocks: ink slab 296×136 (x 480, y 24) with four panel tiles cut out of it in the ground colour · redline slab 172×64 (x 788, y 24, bleeds right) · highlight slab 172×40 (x 788, y 100) · ink slab 468×88 (x 480, y 172, bleeds right and bottom), hatched; every corner radius-0
  arrangement: a title-block grid — one wide ink field over a full-width hatched band, two small markup slabs stacked at the right edge, aligned to the 64px major grid
  pattern: "editorial, 'borders not shadows' → a few hairline rules" crossed with "precise, technical, mono, a grid": the 64px major grid drawn across the whole cover in grid-major, three dimension lines with end ticks in line-strong, and 45° hatching at hatch-pitch inside the lower slab; chosen because the system is a drawing: everything in it is a 1px line on ruled paper
  scales: grid-major-step 64, tiles 124×48 at space-3 gaps inside space-4 padding, hatch-pitch 6, tick 9, stroke-line 1
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="soft"/></pattern>
  </defs>
  <g class="grid">
    <line x1="64" y1="0" x2="64" y2="288"/><line x1="128" y1="0" x2="128" y2="288"/><line x1="192" y1="0" x2="192" y2="288"/><line x1="256" y1="0" x2="256" y2="288"/><line x1="320" y1="0" x2="320" y2="288"/><line x1="384" y1="0" x2="384" y2="288"/><line x1="448" y1="0" x2="448" y2="288"/><line x1="512" y1="0" x2="512" y2="288"/><line x1="576" y1="0" x2="576" y2="288"/><line x1="640" y1="0" x2="640" y2="288"/><line x1="704" y1="0" x2="704" y2="288"/><line x1="768" y1="0" x2="768" y2="288"/><line x1="832" y1="0" x2="832" y2="288"/><line x1="896" y1="0" x2="896" y2="288"/>
    <line x1="0" y1="64" x2="960" y2="64"/><line x1="0" y1="128" x2="960" y2="128"/><line x1="0" y1="192" x2="960" y2="192"/><line x1="0" y1="256" x2="960" y2="256"/>
  </g>
  <rect class="ink" x="480" y="24" width="296" height="136"/>
  <rect class="ground-cut" x="496" y="40" width="124" height="48"/><rect class="ground-cut" x="632" y="40" width="124" height="48"/>
  <rect class="ground-cut" x="496" y="100" width="124" height="48"/><rect class="ground-cut" x="632" y="100" width="124" height="48"/>
  <rect class="red" x="788" y="24" width="200" height="64"/>
  <rect class="hl" x="788" y="100" width="200" height="40"/>
  <rect class="ink" x="480" y="172" width="508" height="140" fill-opacity="0.08"/>
  <rect x="480" y="172" width="508" height="140" fill="url(#hatch)"/>
  <rect class="ln" x="480.5" y="172.5" width="507" height="139"/>
  <g class="ln">
    <line x1="480" y1="12" x2="776" y2="12"/><line x1="480" y1="7" x2="480" y2="17"/><line x1="776" y1="7" x2="776" y2="17"/>
    <line x1="948" y1="24" x2="948" y2="160"/><line x1="943" y1="24" x2="953" y2="24"/><line x1="943" y1="160" x2="953" y2="160"/>
    <line x1="468" y1="172" x2="468" y2="288"/><line x1="463" y1="172" x2="473" y2="172"/>
  </g>
</svg>
<h1 class="name">Forge</h1>
<p class="tagline">software factory</p>
</div>
</body>
</html>
