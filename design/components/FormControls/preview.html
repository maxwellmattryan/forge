<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<div class="row wrap" style="gap:10px"><label for="ref" class="label">Other issue</label><input id="ref" class="input" style="width:180px" placeholder="#123 or owner/repo#123"><button class="btn sm" disabled>Link</button><select class="input" aria-label="Window"><option>Last 7 days</option><option>Last 30 days</option></select><input class="input" value="locked" style="width:120px" disabled aria-label="Locked"></div>
<textarea class="input" rows="2" style="width:100%;margin-top:12px" placeholder="A note for the agents (optional)" aria-label="Note"></textarea>
<div class="row wrap" style="gap:18px;margin-top:12px;font-size:13px"><input class="input" type="search" style="width:220px" placeholder="Filter the log" aria-label="Filter the log"><label class="field"><span class="check on"></span>Tools</label><label class="field"><span class="check"></span>Thinking</label><label class="field"><span class="radio on"></span>Cyanotype</label><label class="field"><span class="radio"></span>Vellum</label></div>
</div></body>
</html>
