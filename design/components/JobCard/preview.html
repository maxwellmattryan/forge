<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:600px"><button class="sheet ticks clickable" style="padding:12px 12px 10px;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;color:inherit;font:inherit"><span class="tk"></span>
  <span class="row" style="align-items:flex-start;justify-content:space-between;gap:10px"><span class="h card grow">Fix the budget chip rounding</span><span class="chip live">reviewing</span></span>
  <span class="mono muted row" style="font-size:11px;gap:8px"><span>#139</span><span>·</span><span>job-a21c</span></span>
  
  <span class="row" style="width:100%"><span class="track grow"><span class="fill" style="display:block;width:100%"></span></span><span class="mono muted num" style="font-size:11px">13/13</span></span>
  <div class="row wrap" style="gap:5px"><span class="chip ok">code</span><span class="chip bad">tests</span><span class="chip muted">ui</span><span class="chip muted">a11y</span></div>
  <span class="label row" style="width:100%;gap:10px;font-size:10px;white-space:nowrap"><span>round 2/3</span><span class="row" style="gap:6px;color:var(--ink)"><span class="dot ink" style="width:6px;height:6px"></span>reviewer</span><span style="margin-left:auto;text-transform:none;letter-spacing:0">184k tok · 3m</span></span>
</button><button class="sheet ticks clickable redline" style="padding:12px 12px 10px;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;color:inherit;font:inherit"><span class="tk"></span>
  <span class="row" style="align-items:flex-start;justify-content:space-between;gap:10px"><span class="h card grow">Add a tracker adapter for Linear</span><span class="chip rev">REV · spec gate</span></span>
  <span class="mono muted row" style="font-size:11px;gap:8px"><span>LIN-88</span><span>·</span><span>job-c90e</span></span>
  
  <span class="row" style="width:100%"><span class="track grow"><span class="fill" style="display:block;width:15%"></span></span><span class="mono muted num" style="font-size:11px">2/13</span></span>
  
  <span class="label row" style="width:100%;gap:10px;font-size:10px;white-space:nowrap"><span>round —</span><span style="margin-left:auto;text-transform:none;letter-spacing:0">184k tok · 3m</span></span>
</button></div>
</div></body>
</html>
