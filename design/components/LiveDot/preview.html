<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" on <html> to see the light theme. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<div class="row wrap label" style="gap:24px;align-items:center">
<span class="row" style="gap:6px;align-items:center;color:var(--ink)"><span style="position:relative;display:inline-flex" aria-hidden="true"><span class="dot ink halo"></span><span class="dot ink" style="position:relative"></span></span><span style="text-transform:none;letter-spacing:0">working · 4s ago</span></span>
<span class="row" style="gap:6px;align-items:center"><span class="chip warn">needs permission</span><span style="text-transform:none;letter-spacing:0">· 12s ago</span></span>
<span class="row" style="gap:6px;align-items:center"><span class="dot hollow" aria-hidden="true"></span><span style="text-transform:none;letter-spacing:0">idle · 2m ago</span></span>
<span class="row" style="gap:6px;align-items:center"><span class="dot hollow" aria-hidden="true"></span><span style="text-transform:none;letter-spacing:0">waiting</span></span>
</div>
<div class="tblock" style="margin-top:16px;max-width:236px"><div><span class="k">SESSIONS</span><span style="position:relative;display:inline-flex;margin-right:4px;vertical-align:middle" aria-hidden="true"><span class="dot ink halo"></span><span class="dot ink" style="position:relative"></span></span>2 active</div><div><span class="k">SESSIONS</span><span class="dot hollow" style="margin-right:4px;vertical-align:middle" aria-hidden="true"></span>0 active</div></div>
</div></body>
</html>
