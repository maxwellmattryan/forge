<!doctype html>
<!-- Static reference rendition. Switch data-theme to "vellum" or "nightprint" on <html> to see the other themes. -->
<html lang="en" data-theme="cyanotype">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../drafting.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body><div class="ground" style="padding:16px;min-height:100vh">
<!-- 1280px with a prompt waiting: the row fits at level 1 (the "Daemon" and "Inbox" words are sr-only). The Daemon popover is open above its indicator, left edges meeting, and the indicator keeps the strong edge. -->
<div style="position:relative;max-width:1044px;height:360px">
<div class="sheet ticks solid col" role="dialog" aria-labelledby="pv-daemon" style="position:absolute;left:12px;bottom:56px;width:560px;box-shadow:var(--shadow-dialog)"><span class="tk"></span>
<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 6px 6px 16px"><h2 id="pv-daemon" class="h section">Daemon</h2><button class="btn sm icon ghost" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/><circle class="cx" cx="12" cy="12" r="9"/></svg></button></div>
<div class="col" style="gap:12px;padding:16px">
<div class="row wrap"><span class="chip sm warn">Daemon needs permission</span><span class="mono muted num">2/3 job sessions</span><span class="mono muted">Default permissions: Ask</span></div>
<div class="row wrap"><button class="btn sm" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/><path class="cx" d="M7 12h13"/></svg>Start</button><button class="btn sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/><path class="cx" d="M6 6l12 12M18 6 6 18"/></svg>Stop</button><span class="chip sm warn">held: budget (1)</span><span class="chip sm live">agents running (1)</span></div>
<div class="col" style="gap:6px"><span class="label">Job sessions</span><div class="row wrap"><button class="chip sm warn"><span class="mono">fix-flaky-login-test</span> · needs permission</button><button class="chip sm live"><span class="mono">add-reading-time</span> · busy</button></div></div>
<div style="border-top:1px solid var(--line);padding-top:12px"><button class="btn sm" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2.5-8h13L21 13v7H3z"/><path d="M3 13h5l2 3h4l2-3h5"/><path class="cx" d="M12 2v3"/></svg>Inbox log</button></div>
</div></div>
<footer class="chrome" style="position:absolute;left:0;right:0;bottom:0;height:48px;border-top:1px solid var(--line-strong);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:0 12px">
<div class="row" style="gap:4px;min-width:0">
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="true" style="border-color:var(--line-strong)"><span style="position:relative;display:inline-flex" aria-hidden="true"><span class="dot ink halo"></span><span class="dot ink" style="position:relative"></span></span><span style="color:var(--warn)">needs permission</span><span class="num">2/3</span></button>
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="false"><span style="color:var(--warn);display:inline-flex"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2.5-8h13L21 13v7H3z"/><path d="M3 13h5l2 3h4l2-3h5"/><path class="cx" d="M12 2v3"/></svg></span><span style="color:var(--warn)">idle</span><span class="num" style="color:var(--warn)">1 prompt</span></button>
</div>
<input class="input" aria-label="New job or command" placeholder="New job or command" style="width:320px;padding-right:56px;border-color:var(--line-strong)">
<div class="row" style="gap:4px;min-width:0;justify-content:flex-end">
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/><circle class="cx" cx="12" cy="7.5" r="6"/></svg>Anthropic · Opus 5.5</button>
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="false"><span class="dot ok" aria-hidden="true"></span><span style="color:var(--ok)">Live</span></button>
</div>
</footer>
</div>
<!-- Below md: glyphs and dots only (44px targets), the palette button between the clusters. -->
<div style="position:relative;max-width:375px;height:48px;margin-top:24px">
<footer class="chrome" style="position:absolute;inset:0;border-top:1px solid var(--line-strong);display:flex;align-items:center;gap:2px;padding:0 4px">
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10"/><path d="M4 10h3M4 14h3M17 10h3M17 14h3M10 4v3M14 4v3M10 17v3M14 17v3"/><circle class="cx" cx="12" cy="12" r="2"/></svg><span class="dot hollow" aria-hidden="true"></span></button>
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2.5-8h13L21 13v7H3z"/><path d="M3 13h5l2 3h4l2-3h5"/><path class="cx" d="M12 2v3"/></svg></button>
<button class="btn grow" aria-haspopup="dialog" style="height:44px;justify-content:center;text-transform:none;letter-spacing:0;min-width:0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/><circle class="cx" cx="12" cy="12" r="8"/></svg><span style="overflow:hidden;text-overflow:ellipsis">New job or command</span></button>
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/><circle class="cx" cx="12" cy="7.5" r="6"/></svg></button>
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><span class="dot ok" aria-hidden="true"></span></button>
</footer>
</div>
</div></body>
</html>
