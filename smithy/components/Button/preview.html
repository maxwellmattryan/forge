<!doctype html>
<!-- Static reference rendition. Switch data-theme to "ash" on <html> to see the light theme. -->
<html lang="en" data-theme="forge">
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../smithy.css">
</head>
<body><div class="ground falloff" style="padding:16px;min-height:100vh">
<div class="row wrap" style="gap:10px">
  <button class="btn primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Run next</button><button class="btn">Stop</button><button class="btn sm">Load older</button><button class="btn" disabled title="No sessions to stop">Stop</button><button class="btn icon ghost" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="btn sm sel" aria-pressed="true">Follow</button>
</div>
<div class="row wrap" style="gap:14px;margin-top:14px">
  <div class="seg"><button class="btn sm sel">Active <span class="num" style="opacity:.7">(3)</span></button><button class="btn sm hover">Waiting <span class="muted num">(1)</span></button><button class="btn sm">Done <span class="muted num">(12)</span></button><button class="btn sm">All <span class="muted num">(16)</span></button></div>
  <div class="seg"><button class="btn sm sel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="10" rx="1"/></svg>Board</button><button class="btn sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M3 15h18M9 5v14"/></svg>Table</button></div>
</div>
</div></body>
</html>
