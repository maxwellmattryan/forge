<!doctype html>
<!-- Static reference rendition. Switch data-theme to "ash" on <html> to see the light theme. -->
<html lang="en" data-theme="forge">
<head><meta charset="utf-8"><title>LiveDot — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../smithy.css">
</head>
<body><div class="ground falloff" style="padding:16px;min-height:100vh">
<div class="row wrap label" style="gap:24px;align-items:center">
<span class="row" style="gap:6px;align-items:center;color:var(--gleam)"><span style="position:relative;display:inline-flex" aria-hidden="true"><span class="dot gleam halo"></span><span class="dot gleam" style="position:relative"></span></span><span style="text-transform:none;letter-spacing:0">working · 4s ago</span></span>
<span class="row" style="gap:6px;align-items:center"><span class="chip warn">needs permission</span><span style="text-transform:none;letter-spacing:0">· 12s ago</span></span>
<span class="row" style="gap:6px;align-items:center"><span class="dot hollow" aria-hidden="true"></span><span style="text-transform:none;letter-spacing:0">idle · 2m ago</span></span>
<span class="row" style="gap:6px;align-items:center"><span class="dot hollow" aria-hidden="true"></span><span style="text-transform:none;letter-spacing:0">waiting</span></span>
</div>
<div class="chrome row" style="margin-top:16px;padding:0 8px;height:36px;border-top:1px solid var(--line-strong);gap:14px;max-width:520px"><div class="facts"><span><span class="k">Sessions</span><span style="position:relative;display:inline-flex" aria-hidden="true"><span class="dot gleam halo"></span><span class="dot gleam" style="position:relative"></span></span><span class="num">2 active</span></span><span class="sep"></span><span><span class="k">Sessions</span><span class="dot hollow" aria-hidden="true"></span><span class="num">0 active</span></span></div></div>
</div></body>
</html>
