<!doctype html>
<!-- Static reference rendition. Switch data-theme to "ash" on <html> to see the light theme. -->
<html lang="en" data-theme="forge">
<head><meta charset="utf-8"><title>StatusBar — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../smithy.css">
</head>
<body><div class="ground falloff" style="padding:16px;min-height:100vh">
<!-- 1100px with a prompt waiting: the row fits at level 1 (the "Daemon" and "Inbox" words are sr-only). The Daemon popover is open above its indicator, left edges meeting, and the indicator keeps the strong edge. -->
<div style="position:relative;max-width:1060px;height:330px">
<div class="plate solid col" role="dialog" aria-labelledby="pv-daemon" style="position:absolute;left:12px;bottom:44px;width:560px;box-shadow:var(--shadow-overlay)">
<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 6px 6px 16px"><h2 id="pv-daemon" class="h section">Daemon</h2><button class="btn sm icon ghost" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="col" style="gap:12px;padding:16px">
<div class="row wrap"><span class="chip sm warn">Daemon needs permission</span><span class="mono muted num">2/3 job sessions</span><span class="mono muted">Default permissions: Ask</span></div>
<div class="row wrap"><button class="btn sm" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Start</button><button class="btn sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>Stop</button><span class="chip sm warn">held: budget (1)</span><span class="chip sm live">agents running (1)</span></div>
<div class="col" style="gap:6px"><span class="label">Job sessions</span><div class="row wrap"><button class="chip sm warn"><span class="mono">fix-flaky-login-test</span> · needs permission</button><button class="chip sm live"><span class="mono">add-reading-time</span> · busy</button></div></div>
<div style="border-top:1px solid var(--line);padding-top:12px"><button class="btn sm" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2-7h12l2 7v7H4z"/><path d="M4 13h5l1.5 3h3L15 13h5"/></svg>Inbox log</button></div>
</div></div>
<footer class="chrome" style="position:absolute;left:0;right:0;bottom:0;height:36px;border-top:1px solid var(--line-strong);display:flex;align-items:center;gap:14px;padding:0 8px">
<div class="row" style="gap:2px;min-width:0;flex:none">
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="true" style="border-color:var(--line-strong)"><span style="position:relative;display:inline-flex" aria-hidden="true"><span class="dot gleam halo"></span><span class="dot gleam" style="position:relative"></span></span><span style="color:var(--warn)">needs permission</span><span class="num">2/3</span></button>
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="false"><span style="color:var(--warn);display:inline-flex"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2-7h12l2 7v7H4z"/><path d="M4 13h5l1.5 3h3L15 13h5"/></svg></span><span style="color:var(--warn)">idle</span><span class="num" style="color:var(--warn)">1 prompt</span></button>
</div>
<div class="facts" aria-label="Forge facts"><span><span class="k">Forge</span>v0.15.0</span><span class="sep"></span><span><span class="k">API</span>3</span><span class="sep"></span><span title="inbox&#10;job-7f3a"><span class="k">Sessions</span><span style="position:relative;display:inline-flex" aria-hidden="true"><span class="dot gleam halo"></span><span class="dot gleam" style="position:relative"></span></span><span class="num">2 active</span></span><span class="sep"></span><span><span class="k">Sheet</span>Pipeline · 1 of 6</span></div>
<div class="row" style="gap:2px;min-width:0;margin-left:auto;flex:none">
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Anthropic · Opus 5.5</button>
<button class="btn sm ghost" aria-haspopup="dialog" aria-expanded="false"><span class="dot ok" aria-hidden="true"></span><span style="color:var(--ok)">Live</span></button>
</div>
</footer>
</div>
<!-- Below md: glyphs and dots only (44px targets); the facts collapse to the version and the live dot; the command input lives in the nav strip. -->
<div style="position:relative;max-width:375px;height:44px;margin-top:24px">
<footer class="chrome" style="position:absolute;inset:0;border-top:1px solid var(--line-strong);display:flex;align-items:center;gap:2px;padding:0 4px">
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M4 10h3M4 14h3M17 10h3M17 14h3M10 4v3M14 4v3M10 17v3M14 17v3"/></svg><span class="dot hollow" aria-hidden="true"></span></button>
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2-7h12l2 7v7H4z"/><path d="M4 13h5l1.5 3h3L15 13h5"/></svg></button>
<div class="facts grow" style="justify-content:center"><span><span class="k">Forge</span>v0.15.0</span><span class="sep"></span><span><span class="dot hollow" aria-hidden="true"></span>0</span></div>
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
<button class="btn sm ghost" aria-haspopup="dialog" style="min-width:44px;height:44px;justify-content:center"><span class="dot ok" aria-hidden="true"></span></button>
</footer>
</div>
</div></body>
</html>
